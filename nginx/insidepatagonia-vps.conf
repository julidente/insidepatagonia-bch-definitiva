# Configuración de ejemplo para producción en VPS.
# Cambiá server_name y las rutas según la carpeta real del proyecto.

server {
    listen 80;
    server_name insidepatagonia-bch.com.ar www.insidepatagonia-bch.com.ar;

    client_max_body_size 20M;

    root /var/www/insidepatagonia/frontend/dist;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        alias /var/www/insidepatagonia/backend/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
}
